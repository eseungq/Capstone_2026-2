name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 설치 스크립트 없이 의존성만 받음 (타입 검사에는 네이티브 빌드가 필요 없음)
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # GitHub 웹에서 고친 코드의 타입 오류를 머지 전에 잡음
      - run: npx tsc --noEmit
