<!doctype html><html lang="ko"><meta charset="utf-8"><title>프레임 레이어별 CAM 검토</title>
<style>body{font:17px sans-serif;max-width:1500px;margin:20px auto;padding:15px;background:#fafafa}section{border:1px solid #bbb;padding:15px;margin:25px 0;background:white}.row{display:flex;gap:15px;flex-wrap:wrap}.photo{max-width:690px;width:100%}.model{flex:1;min-width:350px}.layer{border:2px solid #cad4e0;margin:10px 0;padding:12px}.cam{max-width:490px;width:100%}label{display:block}button,select,input,textarea{font:inherit;margin:5px;padding:8px}textarea{width:90%;height:65px}#bar{position:sticky;top:0;background:#e0edf7;z-index:3;padding:10px}pre{font-size:13px;white-space:pre-wrap}.notice{color:#842800}</style>
<h1>같은 사진의 레이어별 비교</h1><p>두 모델 모두 DEFECT로 예측한 새로운 사진입니다. 유형별 실제 불량 TP3장과 실제 양품 오탐 FP1장을 포함합니다. 실제 정답은 원천 라벨 기준이며 의심되면 메모합니다. FP의 붉은 영역을 실제 손상이라고 확정하지 마세요.</p><p><b>각 레이어의 이미지 바로 아래 항목을 따로 평가</b>합니다. 모델 전체에 한 번만 평가하지 않습니다. 붉은색의 세기·면적을 신뢰도나 결함 크기로 해석하지 않습니다. 0/상수맵은 정상이나 프로그램 실패의 증거가 아닙니다.</p>
<div id="status" class="notice"></div><div id="bar"><label>검토자 <input id="reviewer"></label><select id="filter"><option value="">전체 유형</option></select><span id="progress"></span><button id="export">레이어 검토 JSON 내보내기</button><label>가져오기 <input id="import" type="file" accept="application/json"></label><div id="msg"></div></div><div id="cards"></div>
<script>
const bundle=__BUNDLE__,sel=bundle.selection,report=bundle.report,key='frame_cam_layers_'+sel.review_id;let state={schema:'frame_cam_layer_human_review_v2',review_id:sel.review_id,reviewer:'',reviews:{}};
try{const d=JSON.parse(localStorage.getItem(key));if(d&&d.schema===state.schema&&d.review_id===sel.review_id)state=d;}catch(e){}
function el(t,text,p){const n=document.createElement(t);if(text)n.textContent=text;if(p)p.append(n);return n;}
function select(p,title,opts,v,fn){const l=el('label',title,p),s=el('select','',l);for(const [value,text]of [['','선택하세요'],...opts]){const o=el('option',text,s);o.value=value;}s.value=v||'';s.onchange=()=>fn(s.value);return s;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));document.getElementById('msg').textContent='브라우저 임시 저장됨. 완료 후 JSON 파일로 내보내세요.';}catch(e){document.getElementById('msg').textContent='임시 저장 불가. JSON으로 내보내세요.';}progress();}
function progress(){let complete=0;for(const x of sel.items){const r=state.reviews[x.id]||{};for(const model of ['unified',x.specialist_id])for(const layer of sel.layers){const v=r.models&&r.models[model]&&r.models[model].layers&&r.models[model].layers[layer];if(v&&v.relevance&&v.background&&v.usefulness)complete++;}}document.getElementById('progress').textContent=` 레이어 평가 ${complete}/${sel.items.length*4} `;}
function image(p,path,cls){const a=el('a','',p);a.href=path;a.target='_blank';const i=el('img','',a);i.src=path;i.className=cls;i.loading='lazy';}
function render(){document.querySelector('h1').textContent='같은 사진으로 모델·레이어별 CAM 비교';document.getElementById('reviewer').value=state.reviewer;document.getElementById('status').textContent=report?'GPU 진단 상태: '+report.status+' — 점수 경고는 기록을 유지합니다.':'GPU 계산 전입니다. CAM 실행 후 새로고침하세요. 계산 전에는 평가·내보내기를 진행하지 마세요.';const cards=document.getElementById('cards');cards.replaceChildren();
for(const x of sel.items){const r=state.reviews[x.id]||{models:{}};r.models=r.models||{};state.reviews[x.id]=r;const sec=el('section','',cards);sec.dataset.kind=x.pair.defect_type;el('h2',`${x.id} · ${x.pair.defect_type} · ${Number(x.pair.actual)?'TP: 원천 DEFECT / 두 모델 DEFECT':'FP: 원천 GOOD / 두 모델 DEFECT'}`,sec);const pics=el('div','',sec);pics.className='row';image(pics,`${x.id}/display.png`,'photo');const small=el('div','224 입력',pics);image(small,`${x.id}/input224.png`,'small');const link=el('a','원천 라벨 JSON',sec);link.href=`${x.id}/label.json`;link.target='_blank';
for(const [k,t]of [['original_visibility','원본의 검사 정보'],['input_visibility','224 입력의 검사 정보']])select(sec,t,[['clear','판단 정보가 보임'],['weak','약함'],['unknown','판단 불가']],r[k],v=>{r[k]=v;save();});
const row=el('div','',sec);row.className='row';for(const model of ['unified',x.specialist_id]){const col=el('div','',row);col.className='model';el('h3',model==='unified'?'통합 모델':'개별 모델',col);const result=report&&report.samples[x.id]&&report.samples[x.id][model];const saved=x.pair[model==='unified'?'unified_score':'specialist_score'];el('p','저장된 불량 점수: '+Number(saved).toFixed(6),col);if(result){el('p',`현재 예측 ${result.predicted_quality} · ${result.service_cam_status}`,col);if(!result.single_score_matches_saved||!result.batch_score_matches_saved||!result.class_matches_saved)el('p','점수/클래스 비교 경고: cam_report.json 참조',col);}const m=r.models[model]||{layers:{}};m.layers=m.layers||{};r.models[model]=m;
for(const layer of sel.layers){const box=el('div','',col);box.className='layer';el('h4',layer,box);const info=result&&result.layers.find(v=>v.layer===layer);if(info){el('p',info.status+' · '+info.scope,box);if(info.overlay)image(box,info.overlay,'cam');else el('p','표시할 CAM 없음. 관련성/유용성은 판단 불가·표시 없음으로 기록할 수 있습니다.',box);}else el('p','CAM 계산 전 또는 해당 계산 미완료',box);const rating=m.layers[layer]||{};m.layers[layer]=rating;
for(const [k,title,opts]of [['relevance','이 레이어의 검사 부위 관련성',[['related','관련 부위 반응'],['partial','일부 관련'],['unrelated','관련 없음'],['unknown','판단 불가·표시 없음']]],['background','이 레이어의 배경·다른 구조물 반응',[['not_observed','뚜렷하지 않음'],['observed','반응 있음'],['unknown','판단 불가·표시 없음']]],['usefulness','이 레이어의 설명 유용성',[['useful','도움 됨'],['limited','제한적 도움'],['not_useful','도움 안 됨'],['unknown','판단 불가·표시 없음']]]]){const input=select(box,title,opts,rating[k],v=>{rating[k]=v;save();});input.disabled=!info;}
const note=el('textarea','',box);note.placeholder='이 레이어만의 관찰, FP라면 정상 구조를 결함처럼 강조하는지 등';note.value=rating.note||'';note.oninput=()=>{rating.note=note.value;save();};}}
const note=el('textarea','',sec);note.placeholder='사진/라벨/검사 부위에 대한 공통 메모';note.value=r.note||'';note.oninput=()=>{r.note=note.value;save();};}filter();progress();}
function filter(){const v=document.getElementById('filter').value;document.querySelectorAll('#cards section').forEach(n=>n.hidden=!!v&&n.dataset.kind!==v);}for(const kind of [...new Set(sel.items.map(x=>x.pair.defect_type))]){const o=el('option',kind,document.getElementById('filter'));o.value=kind;}document.getElementById('filter').onchange=filter;document.getElementById('reviewer').oninput=e=>{state.reviewer=e.target.value;save();};document.getElementById('export').onclick=()=>{if(!report){document.getElementById('msg').textContent='GPU 계산을 먼저 실행하세요.';return;}if(!state.reviewer.trim()){document.getElementById('msg').textContent='검토자 이름을 입력하세요.';return;}state.exported_at=new Date().toISOString();const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=el('a','',document.body);a.href=url;a.download=`frame_cam_layer_review_${sel.review_id}.json`;a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);document.getElementById('msg').textContent='다운로드 폴더의 JSON 파일을 확인하세요. 미완료 항목도 보존됩니다.';};document.getElementById('import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!==state.schema||d.review_id!==sel.review_id||!d.reviews)throw Error('이 화면의 레이어별 검토 파일이 아닙니다.');state=d;render();save();}catch(err){document.getElementById('msg').textContent='가져오기 실패: '+err.message;}};render();
</script></html>
