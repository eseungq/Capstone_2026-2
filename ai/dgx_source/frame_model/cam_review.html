<!doctype html><html lang="ko"><meta charset="utf-8"><title>프레임 통합·개별 CAM 비교</title>
<style>body{font:17px sans-serif;max-width:1450px;margin:20px auto;padding:15px;background:#fafafa}section{background:white;border:1px solid #bbb;margin:25px 0;padding:15px}.row{display:flex;gap:14px;flex-wrap:wrap}.model{flex:1;min-width:350px;border:1px solid #ddd;padding:12px}.photo{max-width:630px;width:100%}.cam{max-width:420px;width:100%}button,select,input,textarea{font:inherit;padding:7px;margin:5px}label{display:block}textarea{width:92%;height:65px}#bar{position:sticky;top:0;background:#e0edf7;padding:10px;z-index:2}pre{white-space:pre-wrap;font-size:14px}.notice{color:#842400}</style>
<h1>프레임 통합·개별 모델: 오판과 Grad-CAM 비교</h1><p>내부 검증 중 일부를 선택한 진단 자료입니다. 전체 성능/독립 최종 시험이 아닙니다. 빨간 영역은 정확한 손상 위치·면적이 아닙니다. 선택된 사진만 보고 모델을 확정하지 않습니다.</p>
<p>GOOD 예측의 서비스 CAM은 미생성입니다. GOOD에 표시되는 CAM은 <b>미검출 원인 검토용 진단 계산</b>이며 서비스 출력에 포함하지 않습니다. 0/상수맵은 실패나 정상의 증거가 아닙니다. 두 레이어 모두 후보이며 프레임 운영 레이어는 아직 정하지 않았습니다.</p>
<div id="status" class="notice"></div><div id="bar"><label>검토자 <input id="reviewer"></label><select id="filter"><option value="">전체 유형</option></select><span id="progress"></span><button id="export">검토 JSON 내보내기</button><label>검토 JSON 가져오기 <input id="import" type="file" accept="application/json"></label><div id="msg"></div></div><div id="cards"></div>
<script>
const bundle=__BUNDLE__,sel=bundle.selection,report=bundle.report,key='frame_cam_'+sel.review_id;let state={schema:'frame_cam_human_review_v1',review_id:sel.review_id,reviewer:'',reviews:{}};
try{const d=JSON.parse(localStorage.getItem(key));if(d&&d.review_id===sel.review_id)state=d;}catch(e){}
function el(tag,text,parent){const n=document.createElement(tag);if(text)n.textContent=text;if(parent)parent.append(n);return n;}
function select(parent,title,options,value,change){const label=el('label',title,parent),s=el('select','',label);for(const [v,t]of [['','선택하세요'],...options]){const o=el('option',t,s);o.value=v;}s.value=value||'';s.onchange=()=>change(s.value);return s;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));document.getElementById('msg').textContent='임시 저장됨. 완료 후 JSON 내보내기로 파일을 보존하세요.';}catch(e){document.getElementById('msg').textContent='임시 저장 실패. JSON 내보내기로 보존하세요.';}progress();}
function progress(){const n=sel.items.filter(x=>{const r=state.reviews[x.id]||{};return r.original_visibility&&r.input_visibility&&r.models&&['unified',x.specialist_id].every(k=>{const m=r.models[k];return m&&m.relevance&&m.background&&m.usefulness;});}).length;document.getElementById('progress').textContent=` 필수 선택 ${n}/${sel.items.length} `;}
function image(parent,path,cls){const a=el('a','',parent);a.href=path;a.target='_blank';const im=el('img','',a);im.src=path;im.className=cls;im.loading='lazy';}
function render(){document.getElementById('reviewer').value=state.reviewer;const cards=document.getElementById('cards');cards.replaceChildren();document.getElementById('status').textContent=report?`GPU 진단 상태: ${report.status}. 점수 재현 오류/경고와 CAM 실패는 아래에서 확인하세요.`:'GPU CAM 계산 전입니다. 원본과 저장된 예측만 준비됐습니다. README의 cam 명령을 실행한 뒤 이 화면을 새로고침하세요.';
for(const item of sel.items){const id=item.id,pair=item.pair,sec=el('section','',cards);sec.dataset.kind=pair.defect_type;el('h2',`${id} · ${pair.defect_type} · 원천 정답 ${Number(pair.actual)?'DEFECT':'GOOD'}`,sec);el('p','선정 이유: '+item.selection_reasons.join(', '),sec);const pictures=el('div','',sec);pictures.className='row';image(pictures,`${id}/display.png`,'photo');const small=el('div','224 입력',pictures);image(small,`${id}/input224.png`,'small');const link=el('a','원천 JSON 라벨 보기',sec);link.href=`${id}/label.json`;link.target='_blank';const r=state.reviews[id]||{models:{}};r.models=r.models||{};state.reviews[id]=r;
for(const [k,t]of [['original_visibility','원본에서 결함/정상 상태 판단'],['input_visibility','224 입력에서 판단 정보']])select(sec,t,[['clear','판단 정보가 보임'],['weak','정보가 약함'],['unknown','판단 불가']],r[k],v=>{r[k]=v;save();});
const row=el('div','',sec);row.className='row';for(const model of ['unified',item.specialist_id]){const col=el('div','',row);col.className='model';el('h3',model==='unified'?'통합 모델':'개별 모델',col);const score=pair[model==='unified'?'unified_score':'specialist_score'];const pred=Number(pair[model==='unified'?'unified_prediction':'specialist_prediction']);el('p',`저장된 예측 ${pred?'DEFECT':'GOOD'} · 점수 ${Number(score).toFixed(6)}`,col);const result=report&&report.samples[id]&&report.samples[id][model];if(result){el('p',`단일 추론 ${result.predicted_quality} · 서비스 CAM: ${result.service_cam_status}`,col);if(!result.batch_score_matches_saved||!result.class_matches_saved||!result.single_score_matches_saved)el('pre',JSON.stringify(result,null,2),col);for(const cam of result.layers){el('h4',`${cam.layer} · ${cam.status} · ${cam.scope}`,col);if(cam.overlay)image(col,cam.overlay,'cam');else el('p','표시할 CAM 이미지 없음',col);el('pre',JSON.stringify(cam,null,2),col);}}else el('p','CAM 계산 전 또는 해당 단계 미완료',col);
const m=r.models[model]||{};r.models[model]=m;for(const [k,t,options]of [['relevance','CAM 검사 부위 관련성',[['related','관련 부위에 반응'],['partial','일부 관련'],['unrelated','관련 없어 보임'],['unknown','판단 불가/표시 없음']]],['background','배경·구조물 반응',[['not_observed','뚜렷하지 않음'],['observed','배경/다른 구조에 반응'],['unknown','구분 어려움/표시 없음']]],['usefulness','설명 유용성',[['useful','판단 참고에 도움'],['limited','제한적 도움'],['not_useful','도움이 되지 않음'],['unknown','판단 불가/표시 없음']]]])select(col,t,options,m[k],v=>{m[k]=v;save();});const note=el('textarea','',col);note.placeholder='레이어별 차이, 배경 반응, 원본과 다른 위치 등';note.value=m.note||'';note.oninput=()=>{m.note=note.value;save();};}
const note=el('textarea','',sec);note.placeholder='라벨 의심·반사·잘림·검사 부위 등 사진 공통 메모';note.value=r.note||'';note.oninput=()=>{r.note=note.value;save();};}filter();progress();}
function filter(){const v=document.getElementById('filter').value;document.querySelectorAll('#cards section').forEach(n=>n.hidden=!!v&&n.dataset.kind!==v);}for(const kind of [...new Set(sel.items.map(x=>x.pair.defect_type))]){const o=el('option',kind,document.getElementById('filter'));o.value=kind;}document.getElementById('filter').onchange=filter;document.getElementById('reviewer').oninput=e=>{state.reviewer=e.target.value;save();};document.getElementById('export').onclick=()=>{if(!state.reviewer.trim()){document.getElementById('msg').textContent='검토자 이름을 입력하세요.';return;}state.exported_at=new Date().toISOString();const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=el('a','',document.body);a.href=url;a.download=`frame_cam_review_${sel.review_id}.json`;a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);document.getElementById('msg').textContent='다운로드 폴더의 JSON 파일을 확인하세요.';};document.getElementById('import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!==state.schema||d.review_id!==sel.review_id||!d.reviews)throw Error('다른 검토 파일');state=d;render();save();}catch(err){document.getElementById('msg').textContent='가져오기 실패: '+err.message;}};render();
</script></html>
