<!doctype html><html lang="ko"><meta charset="utf-8"><title>프레임 입력 정보·배경 영역 확인</title>
<style>body{font:17px sans-serif;max-width:1400px;margin:20px auto;padding:10px}header{position:sticky;top:0;background:#e4eef7;padding:12px;z-index:3}article{border-top:2px solid #bbb;margin:25px 0;padding:12px}.inputs{display:flex;gap:12px;flex-wrap:wrap}.inputs img{width:448px;max-width:100%}canvas{width:100%;height:auto;border:1px solid #888;touch-action:none}select,input,button,textarea{font:inherit;margin:5px;padding:7px}label{display:block}textarea{width:90%;height:60px}.notice{background:#fff2cd;padding:10px}</style>
<h1>기존 8장: 축소 정보와 부품·배경 영역</h1><p>추가 학습이나 CAM 평가가 아닙니다. 왼쪽은224 입력을 단순 확대, 오른쪽은원본을448로 축소한 비교입니다. <b>448을 기존224 모델에 넣지 않았으며 성능 개선을 뜻하지 않습니다.</b></p>
<div class="notice">① 원본과 두 입력을 보고 정보 차이를 선택 → ② 부품 검사 영역을 드래그(빨강) → ③ 같은 크기의 배경 영역 중심 클릭(초록) → ④ ‘영역 쌍 저장’. 배경을 구분할 수 없으면 억지로 그리지 말고 ‘지정 불가’를 선택하고 이유를 적으세요.</div>
<header><label>검토자 <input id="reviewer"></label><button id="export">입력·영역 JSON 내보내기</button><label>기존 파일 가져오기 <input id="import" type="file" accept="application/json"></label><div id="message"></div><div id="progress"></div></header><main id="cases"></main>
<script>
const source=__DATA__,key='frame-input-bg:'+source.reviewId;let state={schema:source.schema,reviewId:source.reviewId,reviewer:'',cases:{}};
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.schema===source.schema&&saved.reviewId===source.reviewId)state=saved;}catch(e){}
const message=document.getElementById('message');function el(tag,text,p){const n=document.createElement(tag);if(text)n.textContent=text;if(p)p.append(n);return n;}
function select(p,title,options,value,fn){const l=el('label',title,p),s=el('select','',l);for(const [v,t]of [['','선택하세요'],...options]){const o=el('option',t,s);o.value=v;}s.value=value||'';s.onchange=()=>fn(s.value);return s;}
function complete(r){return r.visibility224&&r.visibility448&&((r.regionStatus==='marked'&&r.partBox&&r.backgroundCenter)||(r.regionStatus==='unavailable'&&r.note&&r.note.trim()));}
function progress(){document.getElementById('progress').textContent=`완료 ${source.cases.filter(x=>complete(state.cases[x.id]||{})).length}/${source.cases.length}`;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){message.textContent='임시 저장 실패. JSON 파일로 보존하세요.';}progress();}
function render(){document.getElementById('reviewer').value=state.reviewer;const root=document.getElementById('cases');root.replaceChildren();for(const sample of source.cases){const r=state.cases[sample.id]||{};state.cases[sample.id]=r;const a=el('article','',root);el('h2',sample.id+' · '+sample.type+' · 원천 '+sample.sourceQuality,a);const original=el('a','원본 확대 보기',a);original.href=sample.originalUrl;original.target='_blank';const pictures=el('div','',a);pictures.className='inputs';for(const [path,title]of [[sample.input224Enlarged,'224 입력을 2배 확대(새 정보 없음)'],[sample.input448,'원본에서 만든448 입력(추론 아님)']]){const col=el('div',title,pictures);const im=el('img','',col);im.src=path;im.loading='lazy';}
for(const [field,title]of [['visibility224','224에서 검사 정보'],['visibility448','448에서 검사 정보']])select(a,title,[['clear','판단할 특징이 보임'],['weak','약함'],['unknown','판단 어려움']],r[field],v=>{r[field]=v;save();});
const modeSelect=select(a,'영역 지정 상태',[['pending','지정 예정'],['marked','영역 쌍 저장됨'],['unavailable','부품/배경 쌍 지정 불가']],r.regionStatus,v=>{r.regionStatus=v;if(v==='unavailable'){delete r.partBox;delete r.backgroundCenter;box=null;center=null;start=null;mode='part';}save();draw();});
const buttons=el('div','',a),reset=el('button','부품 영역 다시 그리기',buttons),add=el('button','영역 쌍 저장',buttons);const status=el('p','',a);status.setAttribute('aria-live','polite');const c=el('canvas','',a),ctx=c.getContext('2d'),im=new Image();let start=null,box=r.partBox||null,center=r.backgroundCenter||null,mode='part';
function notify(text){status.textContent=text;message.textContent=sample.id+': '+text;}
function controlBox(){if(!box||!center)return null;const w=box[2]-box[0],h=box[3]-box[1];return [center[0]-w/2,center[1]-h/2,center[0]+w/2,center[1]+h/2];}
function draw(){if(!im.complete||!im.naturalWidth)return;ctx.drawImage(im,0,0);for(const [b,color]of [[box,'red'],[controlBox(),'lime']])if(b){ctx.strokeStyle=color;ctx.lineWidth=4;ctx.strokeRect(b[0]*c.width,b[1]*c.height,(b[2]-b[0])*c.width,(b[3]-b[1])*c.height);}}
function point(e){const rect=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height))];}
im.onload=()=>{c.width=im.naturalWidth;c.height=im.naturalHeight;draw();if(r.regionStatus==='marked')notify('저장된 영역 쌍을 표시했습니다.');};im.onerror=()=>notify('사진을 읽지 못했습니다.');im.src=sample.preview;
c.onpointerdown=e=>{e.preventDefault();if(mode==='background'){center=point(e);draw();notify('초록 영역이 배경만 포함하는지 확인하고 영역 쌍 저장을 누르세요.');return;}start=point(e);c.setPointerCapture(e.pointerId);};
c.onpointermove=e=>{if(!start)return;const p=point(e);box=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];center=null;draw();};
c.onpointerup=e=>{if(!start)return;const p=point(e);box=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];start=null;center=null;mode='background';draw();notify('같은 크기의 배경 영역을 놓을 중심을 클릭하세요.');};c.onpointercancel=()=>{start=null;};
reset.onclick=()=>{box=null;center=null;start=null;mode='part';delete r.partBox;delete r.backgroundCenter;r.regionStatus='pending';modeSelect.value='pending';save();draw();notify('부품 검사 영역을 다시 드래그하세요.');};
add.onclick=()=>{const b=controlBox();if(!box||!b||box[2]-box[0]<.005||box[3]-box[1]<.005){notify('부품 검사 영역을 드래그한 뒤 배경의 중심을 클릭하세요.');return;}if(b[0]<0||b[1]<0||b[2]>1||b[3]>1){notify('배경 영역이 사진 밖입니다. 더 안쪽을 선택하세요.');return;}if(!(b[2]<=box[0]||b[0]>=box[2]||b[3]<=box[1]||b[1]>=box[3])){notify('부품과 배경 영역이 겹칩니다. 다른 위치를 선택하세요.');return;}r.partBox=[...box];r.backgroundCenter=[...center];r.regionStatus='marked';modeSelect.value='marked';save();notify('영역 쌍 저장됨');};
const note=el('textarea','',a);note.placeholder='영역 지정 불가 이유, 정보 차이, 라벨/형상 의심 등';note.value=r.note||'';note.oninput=()=>{r.note=note.value;save();};}progress();}
document.getElementById('reviewer').oninput=e=>{state.reviewer=e.target.value;save();};document.getElementById('export').onclick=()=>{if(!state.reviewer.trim()){message.textContent='검토자 이름을 입력하세요.';return;}if(source.cases.some(x=>!complete(state.cases[x.id]||{}))){message.textContent='입력 가시성과 영역 쌍을 기록하세요. 지정 불가라면 이유를 적으면 됩니다.';return;}state.exportedAt=new Date().toISOString();const payload={...state,sourceFile:'source.json',probePlanSha256:source.probePlanSha256};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=el('a','',document.body);a.href=url;a.download='frame_input_background_'+source.reviewId+'.json';a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);message.textContent='다운로드 폴더에서 JSON 파일을 확인하세요.';};document.getElementById('import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!==source.schema||d.reviewId!==source.reviewId||!d.cases)throw Error('다른 검토 파일');state=d;render();save();}catch(err){message.textContent='가져오기 실패: '+err.message;}};render();
</script></html>
