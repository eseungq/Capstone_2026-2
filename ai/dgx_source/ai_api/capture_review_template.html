<!doctype html><html lang="ko"><meta charset="utf-8"><title>촬영 적합성 보완 검토</title>
<style>body{font-family:sans-serif;margin:25px;max-width:1450px}article{border-top:2px solid #aaa;padding:20px 0}img{max-width:60%;vertical-align:top}select,input,button{padding:8px;margin:8px}textarea{width:90%;height:65px}#status{background:#fff2bf;padding:12px}.review-header{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}.review-header label{display:flex;flex-direction:column;min-width:240px}.review-header input{display:block;box-sizing:border-box;width:100%;min-height:44px;position:relative;z-index:1;pointer-events:auto;color:#111;background:#fff}.review-header button{align-self:flex-end}</style>
<h1>기존 16장 촬영 적합성 보완</h1><p>구도·각도는 기존 판단을 유지합니다. 모델 예측과 라벨은 표시하지 않습니다. 오른쪽은 기존 BICUBIC 비율 유지 패딩224 입력의 정규화 전 RGB입니다. 작은 흔적은 원본을 확대해 확인하세요. 이 화면에서 부품 GOOD/DEFECT를 정하지 않습니다. 검사 범위가 미정이면 범위 충족은 판단 보류로 기록하세요.</p>
<div class="review-header"><label for="captureReviewerName">검토자 이름<input type="text" id="captureReviewerName" name="capture_reviewer_name" placeholder="이름을 입력하세요" autocomplete="off" spellcheck="false"></label><label>이번 검사 범위<select id="scope"><option value="pending">범위 미정</option><option value="door_outer_face">도어 외측의 정해진 검사 면</option><option value="specified_region">특정 구역</option></select></label><label>검사 면/구역 설명<input id="scopeDescription" placeholder="예: 도어 외측 도장면, 손잡이 주변 제외 여부 등"></label><button id="export">검토 JSON 내보내기</button></div><div id="status">준비 중</div><main id="cases"></main>
<script>
(()=>{
const data=__DATA__,key='door-capture:'+data.sourceSHA256;let state={reviewer:'',records:{}};const status=document.getElementById('status');
try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&old.records)state=old;}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state));status.textContent='임시 저장됨 — 완료 후 JSON을 내보내세요.';}catch(e){status.textContent='자동 저장 불가 — 내보내기로 보존하세요.';}}
const reviewerInput=document.getElementById('captureReviewerName');reviewerInput.value=typeof state.reviewer==='string'?state.reviewer:'';function syncReviewer(){state.reviewer=reviewerInput.value;save();}reviewerInput.oninput=e=>{state.reviewer=reviewerInput.value;if(!e||!e.isComposing)save();};reviewerInput.oncompositionend=syncReviewer;reviewerInput.onchange=syncReviewer;
const scope=document.getElementById('scope'),scopeDescription=document.getElementById('scopeDescription');scope.value=state.scope||'pending';scopeDescription.value=state.scopeDescription||'';scope.onchange=()=>{state.scope=scope.value;save();};scopeDescription.oninput=()=>{state.scopeDescription=scopeDescription.value;save();};
for(const [i,c]of data.cases.entries()){
 if(!state.records[c.id])state.records[c.id]={coverage:'',readability:'',lighting:'',visibility224:'',notes:''};const r=state.records[c.id],a=document.createElement('article');
 const h=document.createElement('h2');h.textContent=(i+1)+'번 — 기존 판단: '+JSON.stringify(c.prior);a.append(h);
 const link=document.createElement('a');link.href=c.originalUrl;link.target='_blank';link.textContent='원본 확대';a.append(link,document.createElement('br'));
 for(const suffix of ['original.jpg','224.png']){const im=document.createElement('img');im.src=c.id+'_'+suffix;im.alt=suffix;a.append(im);}a.append(document.createElement('br'));
 for(const [field,label,opts]of [['coverage','정해진 검사 범위',['충족','일부만 보임','식별 어려움','범위 미정/판단 보류']],['readability','원본 선명도·각도',['판독 가능','판독 어려움','판단 보류']],['lighting','조명·반사 가림',['필요 표면 확인 가능','일부 가림','대부분 가림','판단 보류']],['visibility224','원본 대비224 결함 가시성',['둘 다 보임','원본에만 보임','원본에서도 불확실','결함 흔적 관찰되지 않음','판단 보류']]]){
  const l=document.createElement('label');l.textContent=label;const s=document.createElement('select');for(const v of ['',...opts]){const o=document.createElement('option');o.value=v;o.textContent=v||'선택';s.append(o);}s.value=r[field];s.onchange=()=>{r[field]=s.value;save();};l.append(s);a.append(l);
 }
 const t=document.createElement('textarea');t.placeholder='관찰 근거를 적어주세요. 근접/사선 자체와 실제 판독 문제를 구분하세요.';t.value=r.notes;t.oninput=()=>{r.notes=t.value;save();};a.append(t);document.getElementById('cases').append(a);
}
status.textContent='기존 판단은 보존하며 새로운 관찰만 기록합니다.';
document.getElementById('export').onclick=()=>{try{state.reviewer=reviewerInput.value;const missing=data.cases.filter(c=>Object.values(state.records[c.id]).some(v=>!v.trim()));if(!state.reviewer.trim()||missing.length){status.textContent='검토자와 모든 항목·근거를 입력하세요. 미완료 '+missing.length+'장';return;}if(scope.value!=='pending'&&!scopeDescription.value.trim()){status.textContent='검사 면/구역 설명을 입력하세요.';return;}const result={...data,scopeStatus:scope.value==='pending'?'pending_user_confirmation':'reviewer_specified_scope',inspectionScope:{type:scope.value,description:scopeDescription.value},reviewer:state.reviewer,observations:state.records,exportedAt:new Date().toISOString(),applied:false};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='door_capture_review_'+new Date().toISOString().replaceAll(':','-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='내보냈습니다. 다운로드 폴더를 확인하세요.';}catch(e){status.textContent='내보내기 실패: '+e.message;}};
})();
</script></html>
