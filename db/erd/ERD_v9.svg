oke-width="1"/><text x="1156" y="1022" font-size="15" font-weight="700" fill="#20262D">rule_id PK</text><text x="1156" y="1044" font-size="15" fill="#20262D">rule_version · trial_name</text><text x="1156" y="1066" font-size="15" fill="#20262D">(rule_version, trial_key) UQ</text><text x="1156" y="1088" font-size="15" fill="#20262D">near_ratio · mid_ratio (구간 경계)</text><text x="1156" y="1110" font-size="15" fill="#20262D">near_rate · mid_rate · low_rate (추출 비율)</text><rect x="1140" y="1170" width="420" height="126" rx="10" fill="#F4F6F8" stroke="#5B6B78" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1350.0" y="1200" text-anchor="middle" font-size="19" font-weight="700" fill="#65707A">DefectDetection</text><line x1="1152" y1="1212" x2="1548" y2="1212" stroke="#C9D1D8" stroke-width="1"/><text x="1156" y="1232" font-size="15" font-weight="700" fill="#65707A">detection_id PK · inspection_id FK</text><text x="1156" y="1254" font-size="15" fill="#65707A">patch_id · coordinates_json · patch_score</text><text x="1156" y="1276" font-size="15" fill="#65707A">v4 신규 기록 없음 (과거 기록 보존)</text><path d="M420 150 H520" fill="none" stroke="#5B6B78" stroke-width="1.6"/><text x="430" y="142" font-size="14" font-weight="700" fill="#65707A" text-anchor="start">1</text><text x="508" y="142" font-size="14" font-weight="700" fill="#65707A" text-anchor="end">N</text><path d="M230 238 V300" fill="none" stroke="#5B6B78" stroke-width="1.6"/><text x="240" y="258" font-size="14" font-weight="700" fill="#65707A" text-anchor="start">1</text><text x="240" y="292" font-size="14" font-weight="700" fill="#65707A" text-anchor="start">N</text><path d="M230 664 V710" fill="none" stroke="#5B6B78" stroke-width="1.6"/><text x="240" y="682" font-size="14" font-weight="700" fill="#65707A" text-anchor="start">1</text><text x="240" y="704" font-size="14" font-weight="700" fill="#65707A" text-anchor="start">N</text><path d="M230 856 V900" fill="none" stroke="#5B6B78" stroke-width="1.6"/><text x="240" y="874" fo