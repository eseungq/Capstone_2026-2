_id PK</text><text x="536" y="1094" font-size="15" fill="#20262D">model_id · item_id FK (복합)</text><text x="536" y="1116" font-size="15" fill="#20262D">policy_version UQ</text><text x="536" y="1138" font-size="15" fill="#20262D">calibrator_version</text><text x="536" y="1160" font-size="15" fill="#20262D">pass_threshold · validated_min · validated_max</text><text x="536" y="1182" font-size="15" fill="#20262D">metrics_json (AI 평가 근거)</text><text x="536" y="1204" font-size="15" fill="#20262D">ready · active (모델당 1개 UQ) · activated_at</text><text x="536" y="1226" font-size="15" fill="#20262D">based_on_policy_id FK (기준 조정 원본)</text><text x="536" y="1248" font-size="15" fill="#20262D">target_miss_rate (과거 기록 보존)</text><rect x="1140" y="90" width="420" height="192" rx="10" fill="#F4F6F8" stroke="#5B6B78" stroke-width="1.4"/><text x="1350.0" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#20262D">WorkerConfirmation</text><line x1="1152" y1="132" x2="1548" y2="132" stroke="#C9D1D8" stroke-width="1"/><text x="1156" y="152" font-size="15" font-weight="700" fill="#20262D">confirmation_id PK</text><text x="1156" y="174" font-size="15" fill="#20262D">inspection_id FK · UQ</text><text x="1156" y="196" font-size="15" fill="#20262D">worker_id FK → User</text><text x="1156" y="218" font-size="15" fill="#20262D">final_judgement</text><text x="1156" y="240" font-size="15" fill="#20262D">comment</text><text x="1156" y="262" font-size="15" fill="#20262D">confirmed_at</text><rect x="1140" y="380" width="420" height="192" rx="10" fill="#F4F6F8" stroke="#5B6B78" stroke-width="1.4"/><text x="1350.0" y="410" text-anchor="middle" font-size="19" font-weight="700" fill="#20262D">ImageStorage</text><line x1="1152" y1="422" x2="1548" y2="422" stroke="#C9D1D8" stroke-width="1"/><text x="1156" y="442" font-size="15" font-weight="700" fill="#20262D">image_id PK</text><text x="1156" y="464" font-size="15" fill="#20262D">inspection_id FK</text><text x="1156" y="486" font-size="15"